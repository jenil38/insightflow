<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Without this, mobile browsers lay out at a 980px virtual width and
         scale the result down: the sm/lg breakpoints never fire, the drawer
         navigation never appears, and every touch target renders under size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="InsightFlow: upload a dataset and move from raw file to profiled, cleaned, modelled and explained analysis in one workspace."
    />
    <!-- Paints the browser chrome to match the canvas in each theme. -->
    <meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D11" media="(prefers-color-scheme: dark)" />
    <title>InsightFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
