# Full stack: Postgres, backend, frontend.
#
#   cp .env.docker.example .env
#   docker compose up --build
#
# Then open http://localhost:5173. The API is on http://localhost:8000.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default: nothing outside the compose network
    # needs it, and exposing 5432 is an unnecessary attack surface.
    expose:
      - "5432"
    healthcheck:
      # `pg_isready` alone returns true before the DB accepts real connections
      # during first-time initialisation, so name the user and database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightflow} -d ${POSTGRES_DB:-insightflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        # Wait for the health check, not just for the container to exist -
        # otherwise `alembic upgrade head` races Postgres startup and the
        # backend exits before the database is listening.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-insightflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-insightflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      # Must match the origin the browser actually loads the frontend from.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@insightflow.ai}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Uploaded datasets, cleaned copies and model binaries must outlive the
      # container, so they live on a named volume rather than in the layer.
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time by Vite - see frontend/Dockerfile.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  uploads_data:
