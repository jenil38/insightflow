name: Deploy backend to Azure

# Manual only. This workflow builds and ships a real deployment, unlike
# ci.yml's checks - it must never run on a push or pull_request, only when
# someone explicitly triggers it from the Actions tab (or `gh workflow run`).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to build and deploy (defaults to the commit SHA)"
        required: false
        default: ""

permissions:
  id-token: write   # required for OIDC federated login - no stored password
  contents: read

env:
  # Must match deploy/azure/vars.sh. Keep both in sync by hand if you rename
  # anything there - see the comment at the top of vars.sh for why this
  # workflow does not read that file directly.
  RESOURCE_GROUP: insightflow-rg
  ACR_NAME: insightflowacr
  CONTAINER_APP_NAME: insightflow-backend
  IMAGE_NAME: insightflow-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # OIDC: GitHub issues a short-lived token this job exchanges for an
      # Azure access token, scoped to the federated credential you create for
      # this repo (see docs/DEPLOY_AZURE.md). No client secret is stored
      # anywhere - AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID below identify
      # the app registration and subscription, they are not credentials.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Builds in ACR itself (ACR Tasks), the same way deploy/azure/setup.sh
      # builds the first image - no Docker daemon needed on the runner, and
      # one less thing that can differ between the two build paths.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" \
            --image "$IMAGE_NAME:latest" \
            --file backend/Dockerfile \
            backend

      - name: Deploy to Container Apps
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer -o tsv)"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.tag.outputs.tag }}"

      - name: Show the deployed URL
        run: |
          APP_URL="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Deployed: https://$APP_URL"
          echo "Health check: curl https://$APP_URL/health"
