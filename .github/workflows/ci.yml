name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_insightflow.db
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -x -q --tb=short

  agent-eval-replay:
    # Replays recorded model responses through the real agent code and checks the
    # outcome of every case against the committed baseline. No key, no network, no
    # rate limit. It proves the harness, tools, sanitiser and confirmation flow still
    # behave as recorded; it does not measure the model or the prompt (that needs a
    # live run, done by hand). A prompt, tool or tool-output change fails it as a
    # stale cassette, which is the prompt to re-record.
    name: Agent eval (replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m evals run --mode replay --tags all --check-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-report
          path: backend/evals/results/
          if-no-files-found: ignore

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check --select E4,E7,E9,F app/ tests/ evals/
      - run: ruff format --check app/ tests/ evals/

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./migration_test.db
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: |
          python -c "from app.database import engine; from sqlalchemy import inspect; i = inspect(engine); tables = i.get_table_names(); assert 'users' in tables, f'Missing users table. Found {tables}'; print(f'OK: {len(tables)} tables created')"
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-check:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-* || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm audit --audit-level=high || true
